          --ssl-keyfile /var/run/kserve/tls/tls.key \
          ${VLLM_ADDITIONAL_ARGS} \
          $@"
      - --
      env:
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            apiVersion: v1
